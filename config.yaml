# ─── AI Music Channel configuration ──────────────────────────────────────────
channel:
  name: "Neon Ghost Radio"          # shown on videos & thumbnails — change it!
  artist: "NGR"                     # the "artist" credited on every track
  # false = titles, descriptions, tags, hashtags and channel art never mention AI, so viewers can
  #         guess for themselves. YouTube's own "altered or synthetic content" flag stays on regardless
  #         (platform requirement; it's a small note in the expanded description).
  # true  = reveal mode: "AI Song" in titles, a "how this was made" section, AI tags, AI channel art.
  disclose_ai: false

# Each day picks a language (weighted) and a song type (rap vs. sung).
languages:
  - { code: en,       name: "English",                              weight: 45 }
  - { code: hi,       name: "Hindi",                                weight: 30 }
  - { code: hinglish, name: "Hinglish (Hindi mixed with English)",  weight: 25 }
song_types: { rap: 50, sung: 50 }

# Genres rotate so the channel stays varied (no repeat within `avoid_recent`).
# type: rap | sung.  langs: which languages it's used for (omit = all).
genres:
  # rap
  - { name: "hip hop",            type: rap,  style: "boom bap hip hop, hard drums, vinyl crackle, rap" }
  - { name: "trap",               type: rap,  style: "dark trap, 808 bass, hi-hat rolls, aggressive rap" }
  - { name: "drill",              type: rap,  style: "drill, sliding 808, dark piano, rap" }
  - { name: "desi hip hop",       type: rap,  langs: [hi, hinglish], style: "desi hip hop, tabla samples, dholak, hard drums, indian rap" }
  - { name: "desi drill",         type: rap,  langs: [hi, hinglish], style: "desi drill, sliding 808, sitar sample, dark, indian rap" }
  - { name: "gully rap",          type: rap,  langs: [hi, hinglish], style: "mumbai gully rap, raw boom bap, street, indian rap" }
  # sung
  - { name: "pop",                type: sung, style: "modern pop, catchy hook, bright synths, female vocals" }
  - { name: "lo-fi",              type: sung, style: "lo-fi, mellow, jazzy chords, chill vocals" }
  - { name: "synthwave",          type: sung, style: "80s synthwave, retro synths, gated reverb drums, dreamy vocals" }
  - { name: "rock",               type: sung, style: "alternative rock, distorted guitars, live drums, powerful vocals" }
  - { name: "edm",                type: sung, style: "edm, festival, big drop, four on the floor, energetic vocals" }
  - { name: "r&b",                type: sung, style: "smooth r&b, neo soul, warm bass, silky vocals" }
  - { name: "afrobeats",          type: sung, langs: [en], style: "afrobeats, percussive groove, warm guitar, melodic vocals" }
  - { name: "country",            type: sung, langs: [en], style: "modern country, acoustic guitar, storytelling vocals" }
  - { name: "bollywood romantic", type: sung, langs: [hi, hinglish], style: "bollywood romantic ballad, strings, piano, soft tabla, emotional vocals" }
  - { name: "bollywood dance",    type: sung, langs: [hi, hinglish], style: "bollywood dance pop, dhol, punchy synths, festive, energetic vocals" }
  - { name: "sufi rock",          type: sung, langs: [hi],           style: "sufi rock, harmonium, electric guitar, qawwali claps, soulful vocals" }
  - { name: "lo-fi bollywood",    type: sung, langs: [hi, hinglish], style: "lo-fi bollywood, mellow, vinyl, soft sitar, chill vocals" }
  - { name: "indie pop",          type: sung, langs: [hi, hinglish], style: "indian indie pop, acoustic guitar, warm, heartfelt vocals" }
avoid_recent: 5

song:
  duration_seconds: 150     # target length for the AI-sung version (ACE-Step)

# Music engines are tried in order until one works.
#   ace_step  → full AI song WITH real singing/rapping (free HF ZeroGPU; needs HF_TOKEN secret)
#   local     → beat synthesized on the runner + rapped TTS vocals (always works, lower quality)
music:
  # Only ACE-Step for uploads: the "local" engine (synth beat + TTS voice) is test-quality and must
  # never be published. If ACE-Step can't make a song, that slot is skipped. Use --backend local to test.
  #   kaggle    → ACE-Step on a free Kaggle GPU (~30 GPU-h/week; KAGGLE_USERNAME + KAGGLE_KEY secrets)
  #   ace_step  → ACE-Step on Hugging Face's free ZeroGPU Space (small daily allowance)
  backends: ["kaggle", "ace_step"]
  kaggle:
    kernel_slug: "ngr-ace-step"     # private notebook created in your Kaggle account
    timeout_minutes: 50
  ace_step:
    spaces: ["ACE-Step/ACE-Step"]   # add duplicates/alternatives here
    infer_steps: 60
    guidance_scale: 15.0
    quota_max_wait_minutes: 40      # if the free GPU quota is out, wait up to this long for it to refill
    # Script sent to ACE-Step for Hindi lyrics: "roman" (Hinglish spelling) or "devanagari".
    hindi_script: "roman"
  local:
    tts: "edge"                     # "edge" (free neural voices) → falls back to espeak-ng

# Lyrics/ideas come from an LLM. Providers are tried in order; the first one
# whose credentials exist and responds wins.
#   gemini → Google AI Studio free tier (GEMINI_API_KEY secret) — recommended, great at Hindi
#   groq   → Groq free tier (GROQ_API_KEY secret)
#   github → GitHub Models via the built-in GITHUB_TOKEN (returned a bare "OK" in our tests)
#   hf     → Hugging Face router (needs paid credits — not free)
# If none work, a built-in song is used so the daily upload still happens.
llm:
  providers:
    - { name: gemini, model: "gemini-3.8-flash" }
    - { name: gemini, model: "gemini-flash-lite-latest" }   # separate daily quota, faster
    - { name: gemini, model: "gemini-flash-latest" }
    - { name: groq,   model: "llama-3.3-70b-versatile" }
    - { name: github, model: "openai/gpt-4.1" }

video:
  width: 1920
  height: 1080
  fps: 30
  lyrics_captions: true
  lyric_scenes: true      # animated scenes driven by the lyrics (rain, fire, city, hearts, stars…)

# Vertical 9:16 clip (best ~45 s, starting before the first chorus) for Reels and Shorts.
reels:
  enabled: true
  seconds: 45
  youtube_shorts: true        # also upload the clip as a YouTube Short

instagram:
  enabled: true               # needs IG_USER_ID + IG_ACCESS_TOKEN secrets (see branding/INSTAGRAM_SETUP.md)
  graph_version: "v23.0"
  hashtags: ["#newmusic", "#reels", "#music", "#song", "#lyrics", "#musicreels"]

facebook:
  enabled: true               # posts the reel to the Facebook Page too (token needs pages_manage_posts)

youtube:
  privacy: "public"           # public | unlisted | private
  category_id: "10"           # 10 = Music
  made_for_kids: false
  default_tags: ["new music", "music video", "new song", "original song", "lyrics video"]
  ai_tags: ["ai music", "ai generated song", "ai song"]        # added only when disclose_ai is true
  # Optional line added to every description, e.g. "Real voice or AI? 🤔 Comment your guess 👇"
  engagement_line: ""
