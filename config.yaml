# ─── AI Music Channel configuration ──────────────────────────────────────────
channel:
  name: "Neon Ghost Radio"          # shown on videos & thumbnails — change it!
  artist: "NGR"                     # the AI "artist" credited on every track
  language: "English"

# Genres rotate so the channel stays varied. The pipeline avoids repeating any
# genre used in the last `avoid_recent` uploads.
genres:
  - { name: "hip hop",     style: "boom bap hip hop, hard drums, vinyl crackle, rap" }
  - { name: "trap",        style: "dark trap, 808 bass, hi-hat rolls, aggressive rap" }
  - { name: "lo-fi",       style: "lo-fi hip hop, mellow, jazzy chords, chill vocals" }
  - { name: "pop",         style: "modern pop, catchy hook, bright synths, female vocals" }
  - { name: "synthwave",   style: "80s synthwave, retro synths, gated reverb drums, dreamy vocals" }
  - { name: "rock",        style: "alternative rock, distorted guitars, live drums, powerful vocals" }
  - { name: "edm",         style: "edm, festival, big drop, four on the floor, energetic vocals" }
  - { name: "r&b",         style: "smooth r&b, neo soul, warm bass, silky vocals" }
  - { name: "drill",       style: "uk drill, sliding 808, dark piano, rap" }
  - { name: "pop punk",    style: "pop punk, fast drums, power chords, shouted chorus" }
  - { name: "afrobeats",   style: "afrobeats, percussive groove, warm guitar, melodic vocals" }
  - { name: "country",     style: "modern country, acoustic guitar, storytelling vocals" }
avoid_recent: 5

song:
  duration_seconds: 150     # target length for the AI-sung version (ACE-Step)

# Music engines are tried in order until one works.
#   ace_step  → full AI song WITH real singing/rapping (free HF ZeroGPU; needs HF_TOKEN secret)
#   local     → beat synthesized on the runner + rapped TTS vocals (always works, lower quality)
music:
  backends: ["ace_step", "local"]
  ace_step:
    spaces: ["ACE-Step/ACE-Step"]   # add duplicates/alternatives here
    infer_steps: 60
    guidance_scale: 15.0
  local:
    tts: "edge"                     # "edge" (free neural voices) → falls back to espeak-ng

# Lyrics/ideas come from an LLM. Providers are tried in order; the first one
# whose credentials exist and responds wins.
#   hf     → Hugging Face router, reuses HF_TOKEN (free monthly credits)
#   github → GitHub Models, free, uses the built-in GITHUB_TOKEN in Actions
#   gemini → Google AI Studio free tier (optional GEMINI_API_KEY secret)
#   groq   → Groq free tier (optional GROQ_API_KEY secret)
llm:
  providers:
    - { name: hf,     model: "meta-llama/Llama-3.3-70B-Instruct" }
    - { name: hf,     model: "openai/gpt-oss-120b" }
    - { name: github, model: "openai/gpt-4.1" }
    - { name: gemini, model: "gemini-2.5-flash" }
    - { name: groq,   model: "llama-3.3-70b-versatile" }

video:
  width: 1920
  height: 1080
  fps: 30
  lyrics_captions: true

youtube:
  privacy: "public"           # public | unlisted | private
  category_id: "10"           # 10 = Music
  made_for_kids: false
  default_tags: ["ai music", "ai generated song", "music video", "new music"]
